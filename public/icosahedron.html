<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>NARIMATO // Icosahedron Physics</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d12; }
    canvas { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: grab; }
    canvas:active { cursor: grabbing; }
    .hint { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); color: rgba(190,230,245,.55);
      font: 10px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .12em; pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="icosa-canvas" aria-label="Interactive spherical icosahedron"></canvas>
  <div class="hint">DRAG ROTATES OBJECT · CURSOR KEYS MOVE CAMERA · WHEEL / PINCH ZOOM</div>
  <script type="module" src="/js/icosahedron-viewer.js"></script>
</body>
</html>
